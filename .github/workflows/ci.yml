#
# CI workflow — build validation on push to main and on every PR.
#
# Lighter than release.yml: only Linux and Windows x86_64 are built
# (skipping Win32 keeps CI under ~5 minutes), no Omni-Bot runtime
# fetch (FEATURE_OMNIBOT=ON only requires the headers shipped in
# vendor/Omnibot/Common/, the runtime is dlopened at game-start),
# no pk3 packaging, no artifact uploads, no release. Compilation
# gate — fails the commit/PR if the C/C++ code stops building on
# either tier-1 platform, AND fails if FEATURE_OMNIBOT silently
# drops out of any qagame artifact (the v0.5.2-rc1 regression).
#
# Triggers from any push to main and any PR targeting main. The two
# jobs run in parallel.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    shell: bash

jobs:
  # -------------------------------------------------------------------
  # build-linux — quick Linux compile. FEATURE_OMNIBOT=ON compiles in
  # the bot-init dlopen() hooks (no runtime fetch needed — only headers
  # in vendor/Omnibot/Common/), BUILD_MOD_PK3=OFF skips the multi-arch
  # packaging.
  # -------------------------------------------------------------------
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (full history for git describe)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config

      # No CI_ETL_TAG passed: relies on the v0.4.4-prep auto-versioning
      # in cmake/ETLVersion.cmake. With fetch-depth: 0 above, git
      # describe finds the most recent tag (annotated or lightweight).
      # The CI workflow validates that the auto-detect path actually
      # works — if it ever silently regresses, this build will start
      # producing pk3s named "vanguard_2.83-dirty.pk3" and stand out
      # in the build log.
      - name: Configure
        run: |
          cmake -B build \
            -DCROSS_COMPILE32=OFF -DBUILD_MOD_PK3=OFF -DFEATURE_OMNIBOT=ON \
            -DBUILD_CLIENT=OFF -DBUILD_SERVER=OFF -DBUILD_MOD=ON \
            -DBUNDLED_LIBS=OFF -DFEATURE_LUA=OFF \
            -DFEATURE_DBMS=OFF -DFEATURE_RATING=OFF -DFEATURE_PRESTIGE=OFF \
            -DINSTALL_EXTRA=OFF

      - name: Build
        run: cmake --build build -j

      - name: Verify Omni-bot symbols in qagame Linux SO
        run: |
          # Catches the v0.5.2-rc1 regression: a wrong build flag would
          # silently elide every #ifdef FEATURE_OMNIBOT block from the
          # binary. If this fails, check the Configure step's flags.
          set -euo pipefail
          BIN=$(find build -name 'qagame.mp.*.so' -print -quit)
          test -n "${BIN}"
          COUNT=$(strings -a "${BIN}" | grep -ic "omni")
          echo "Omni-bot symbol count in ${BIN}: ${COUNT}"
          if [ "${COUNT}" -lt 5 ]; then
            echo "::error::FEATURE_OMNIBOT not in Linux qagame — only ${COUNT} omni symbols (expect 30+)"
            exit 1
          fi

      - name: Verify community WolfGuard banner string in qagame Linux SO
        run: |
          # v0.6.0 sanity gate. The community build must include
          # wg_stub.c + wg_banner.c with the [ NOT INCLUDED ] banner
          # variant. If this gate ever fires, the most likely cause is
          # FEATURE_WOLFGUARD got accidentally enabled (CI default is
          # OFF) or wg_banner.c was dropped from the qagame target
          # (cmake/ETLBuildMod.cmake). Phase 7.0 lesson #2 — build-flag
          # mismatches cascade subtly; a binary-string check catches
          # what symbol greps would miss.
          set -euo pipefail
          BIN=$(find build -name 'qagame.mp.*.so' -print -quit)
          test -n "${BIN}"
          COUNT=$(strings -a "${BIN}" | grep -c "NOT INCLUDED")
          echo "Community banner string count in ${BIN}: ${COUNT}"
          if [ "${COUNT}" -lt 1 ]; then
            echo "::error::CI gate FAILED: community banner string not found in qagame binary."
            echo "::error::This usually means FEATURE_WOLFGUARD got accidentally enabled,"
            echo "::error::or wg_banner.c was not compiled."
            exit 1
          fi

      - name: Verify Phase 13 splash-bypass helpers in qagame Linux SO
        run: |
          # v0.7.2.1 Phase 13 sanity gate: splash-damage MOD bypass
          # helpers (vg_Hitbox_IsSplashMod, vg_Hitbox_IsBypassMod) must
          # be linked into qagame, otherwise the strict-rejection
          # bypass at g_combat.c:2040 silently fails (= splash damage
          # broken, the v0.7.2 production-blocker bug). Threshold ≥2
          # = both helper symbols present.
          set -euo pipefail
          BIN=$(find build -name 'qagame.mp.*.so' -print -quit)
          test -n "${BIN}"
          COUNT=$(nm -a "${BIN}" | grep -cE "vg_Hitbox_IsSplashMod|vg_Hitbox_IsBypassMod" || true)
          echo "Splash-bypass helper count in ${BIN}: ${COUNT}"
          if [ "${COUNT}" -lt 2 ]; then
            echo "::error::v0.7.2.1 splash-bypass helpers not found (got ${COUNT}, expected >=2)."
            echo "::error::Check that g_vanguard.c defines vg_Hitbox_IsSplashMod + vg_Hitbox_IsBypassMod."
            exit 1
          fi

      - name: Verify Phase 13 CVAR_SERVERINFO in vg_Fun_RegisterCvar
        run: |
          # v0.7.2.1: vg_Fun_RegisterCvar must always add
          # CVAR_SERVERINFO so cgame's bg_pmove.c reads via
          # trap_Cvar_VariableStringBuffer return correct values
          # (otherwise vg_fun features in shared pmove silently
          # fail in client prediction). Static-source check —
          # the OR-in is a single line that must be present.
          set -euo pipefail
          if ! grep -q "cvar_flags |= CVAR_SERVERINFO" src/game/g_vanguard.c; then
            echo "::error::v0.7.2.1: vg_Fun_RegisterCvar missing CVAR_SERVERINFO OR-in."
            echo "::error::Check src/game/g_vanguard.c — the line 'cvar_flags |= CVAR_SERVERINFO' must be present."
            exit 1
          fi
          echo "vg_Fun_RegisterCvar SERVERINFO OR-in: VERIFIED"

      - name: Verify Phase 13b idempotent vg_Fun_RegisterCvar
        run: |
          # v0.7.2.2: vg_Fun_RegisterCvar must walk the registry
          # for an existing entry by name before bumping the count.
          # vg_Fun_Init is called from G_InitGame on every map_restart
          # — without idempotent semantics the static registry
          # accumulates 9 entries per map and overflows after ~7 maps,
          # producing "VG_Fun: registry full (max=64); cannot register
          # vg_fun_*" log lines and silently dropping registration.
          # Static-source grep for the loop predicate.
          set -euo pipefail
          if ! grep -q "Q_stricmp(s_vg_fun_registry\[i\].name" src/game/g_vanguard.c; then
            echo "::error::v0.7.2.2: vg_Fun_RegisterCvar missing idempotent-lookup loop."
            echo "::error::Expected: 'for (i = 0; i < s_vg_fun_registry_count; i++) { if (Q_stricmp(s_vg_fun_registry[i].name, name) == 0) { ... } }'"
            echo "::error::Check src/game/g_vanguard.c — without this, static registry overflows on map_restart cycles."
            exit 1
          fi
          echo "vg_Fun_RegisterCvar idempotent-lookup loop: VERIFIED"

      - name: Verify Phase 13b PM_CheckJump diagnostic in qagame Linux SO
        run: |
          # v0.7.2.2 diagnostic-first hotfix gate. PM_CheckJump must
          # contain the server-side "VG_DJ[S] press:" diagnostic
          # format string (gated by vanguard_dev=1 so it's quiet
          # in production). Server-side only — cgame can't see
          # CVAR_SERVERINFO cvars via trap_Cvar_VariableStringBuffer
          # and would always log zeros until v0.7.2.3 swaps the
          # cgame read path. Threshold ≥1 = format string present.
          # Removed in v0.7.2.3 once root cause is identified — at
          # that point this gate gets removed too.
          set -euo pipefail
          BIN=$(find build -name 'qagame.mp.*.so' -print -quit)
          test -n "${BIN}"
          COUNT=$(strings -a "${BIN}" | grep -c "VG_DJ\[S\] press:" || true)
          echo "Phase 13b diag string count in ${BIN}: ${COUNT}"
          if [ "${COUNT}" -lt 1 ]; then
            echo "::error::v0.7.2.2 PM_CheckJump diagnostic format string not found in qagame binary."
            echo "::error::Check that bg_pmove.c contains the #ifndef CGAMEDLL block with Com_Printf(\"VG_DJ[S] press:...\")."
            exit 1
          fi

      - name: Verify vg_fun_doublejump cvars in qagame Linux SO
        run: |
          # v0.7.2 Phase 12 sanity gate. The qagame binary must
          # contain all 4 vg_fun_doublejump_* cvar name strings
          # registered by vg_Fun_Init: master toggle + height +
          # classes + stamina. Threshold ≥4 = exact match. Catches
          # the case where a future PR drops one of the
          # vg_Fun_RegisterCvar calls or renames a cvar.
          set -euo pipefail
          BIN=$(find build -name 'qagame.mp.*.so' -print -quit)
          test -n "${BIN}"
          COUNT=$(strings -a "${BIN}" | grep -c "vg_fun_doublejump")
          echo "vg_fun_doublejump cvar count in ${BIN}: ${COUNT}"
          if [ "${COUNT}" -lt 4 ]; then
            echo "::error::v0.7.2 vg_fun_doublejump cvars not found (got ${COUNT}, expected >=4)."
            echo "::error::Check that vg_Fun_Init in g_vanguard.c registers all 4 doublejump cvars."
            exit 1
          fi

      - name: Verify Phase 10 perf-cache symbols in qagame Linux SO
        run: |
          # v0.7.1.1 Phase 10 perf hotfix sanity gate. The qagame
          # binary must contain the bone+tag cache infrastructure
          # symbols + the perf-stats cvar + the per-second emission
          # format string. Threshold ≥3 = at minimum cvar +
          # one cache symbol + format string. Catches the case
          # where a future PR drops vg_perf_* counter externs or
          # bypasses the cache logic (e.g. accidentally calls
          # mdx_calculate_bones unconditionally).
          set -euo pipefail
          BIN=$(find build -name 'qagame.mp.*.so' -print -quit)
          test -n "${BIN}"
          COUNT=$(strings -a "${BIN}" | grep -c "vg_perf\|vgPerfBoneCache\|vanguard_perf_stats\|VG_Perf")
          echo "Phase 10 perf symbol count in ${BIN}: ${COUNT}"
          if [ "${COUNT}" -lt 3 ]; then
            echo "::error::v0.7.1.1 Phase 10 perf symbols not found (got ${COUNT}, expected >=3)."
            echo "::error::Check that g_mdx.c has vg_tag_orientation_cached + vg_perf_* counters,"
            echo "::error::g_local.h has VG_PERF_MAX_BONES + vgPerfBoneCache, g_cvars.c registers vanguard_perf_stats."
            exit 1
          fi

      - name: Verify vg_fun falldamage cvars in qagame Linux SO
        run: |
          # v0.7.1 Phase 8.0b sanity gate. The qagame binary must
          # contain the 5 vg_fun_falldmg_* cvar name strings (4 damage
          # values + gib_health) registered by vg_Fun_Init via
          # vg_Fun_RegisterCvar. Threshold ≥5 = exact match. Catches
          # the case where a future PR drops one of the
          # vg_Fun_RegisterCvar calls or renames a cvar without
          # updating the helper-API call site in g_active.c.
          set -euo pipefail
          BIN=$(find build -name 'qagame.mp.*.so' -print -quit)
          test -n "${BIN}"
          COUNT=$(strings -a "${BIN}" | grep -c "vg_fun_falldmg")
          echo "vg_fun_falldmg cvar count in ${BIN}: ${COUNT}"
          if [ "${COUNT}" -lt 5 ]; then
            echo "::error::v0.7.1 vg_fun_falldmg cvars not found (got ${COUNT}, expected >=5)."
            echo "::error::Check that vg_Fun_Init in g_vanguard.c registers all 5 falldamage cvars."
            exit 1
          fi

      - name: Verify VG_Branding lookup table in ui Linux SO
        run: |
          # v0.7.0.1 Phase Branding 2 sanity gate. The ui module must
          # contain the vg_mod_brands lookup table + the VG_Branding_*
          # helper symbols. Threshold ≥2 covers the table symbol +
          # at least one VG_Branding_* string. Catches the case where
          # ui_vg_branding.c got dropped from the UI build (cmake
          # FILE(GLOB) re-glob misses on stale configure state).
          set -euo pipefail
          BIN=$(find build -name 'ui.mp.*.so' -print -quit)
          test -n "${BIN}"
          COUNT=$(strings -a "${BIN}" | grep -c "vg_mod_brands\|VG_Branding")
          echo "VG_Branding symbol count in ${BIN}: ${COUNT}"
          if [ "${COUNT}" -lt 2 ]; then
            echo "::error::v0.7.0.1 VG_Branding lookup table not found in ui binary (got ${COUNT}, expected >=2)."
            echo "::error::Check that src/ui/ui_vg_branding.c is compiled into the ui module (cmake re-configure if needed)."
            exit 1
          fi

      - name: Verify vg_fun foundation in qagame Linux SO
        run: |
          # v0.7.0 sanity gate (Phase 9.0 audit §9). The qagame binary
          # must contain the vg_fun master cvar + helper API symbols +
          # boot-line / status-banner strings. Threshold ≥3 covers the
          # cvar name, the VG_Fun: log line, and the VG_FUN STATE
          # banner header at minimum. v0.7.1+ feature additions push
          # the count higher; the gate stays at ≥3 (foundation
          # presence check, not feature-count enforcement).
          # TODO v0.7.1: add a discipline grep that catches direct
          # `.integer`/`.value` reads on `vg_fun_*` cvars outside
          # `g_vanguard.c` (Strategy C lock-mechanism enforcement).
          set -euo pipefail
          BIN=$(find build -name 'qagame.mp.*.so' -print -quit)
          test -n "${BIN}"
          COUNT=$(strings -a "${BIN}" | grep -c "vg_fun\|VG_Fun")
          echo "vg_fun foundation symbol count in ${BIN}: ${COUNT}"
          if [ "${COUNT}" -lt 3 ]; then
            echo "::error::CI gate FAILED: vg_fun symbols not found in qagame binary (got ${COUNT}, expected >=3)."
            echo "::error::Check that vg_Fun_* subsystem in g_vanguard.c is compiled and the master cvar registered in g_cvars.c."
            exit 1
          fi

  # -------------------------------------------------------------------
  # build-windows-x64 — Windows x86_64 cross via mingw-w64. Same
  # flags as the release workflow, just no upload.
  # -------------------------------------------------------------------
  build-windows-x64:
    name: Build Windows x86_64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (full history for git describe)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config mingw-w64

      # Auto-version (no CI_ETL_TAG override) — same rationale as the
      # Linux job above. FORCE_OMNIBOT=ON: cmake_dependent_option in
      # CMakeLists.txt:102 auto-disables FEATURE_OMNIBOT on mingw cross
      # despite the user setting; the override puts it back. See
      # release.yml for the matching production setup.
      - name: Configure
        run: |
          cmake -B build-windows \
            -DCMAKE_TOOLCHAIN_FILE=cmake/Toolchain-cross-mingw-x64-linux.cmake \
            -DCROSS_COMPILE32=OFF -DBUILD_MOD_PK3=OFF \
            -DFEATURE_OMNIBOT=ON -DFORCE_OMNIBOT=ON \
            -DBUILD_CLIENT=OFF -DBUILD_SERVER=OFF -DBUILD_MOD=ON \
            -DBUNDLED_LIBS=OFF -DFEATURE_LUA=OFF \
            -DFEATURE_DBMS=OFF -DFEATURE_RATING=OFF -DFEATURE_PRESTIGE=OFF \
            -DINSTALL_EXTRA=OFF

      - name: Build
        run: cmake --build build-windows -j

      - name: Verify Omni-bot symbols in qagame Win64 DLL
        run: |
          set -euo pipefail
          BIN=$(find build-windows -name 'qagame_mp_*.dll' -print -quit)
          test -n "${BIN}"
          COUNT=$(strings -a "${BIN}" | grep -ic "omni")
          echo "Omni-bot symbol count in ${BIN}: ${COUNT}"
          if [ "${COUNT}" -lt 5 ]; then
            echo "::error::FEATURE_OMNIBOT not in Win64 qagame — only ${COUNT} omni symbols (expect 30+)"
            exit 1
          fi
