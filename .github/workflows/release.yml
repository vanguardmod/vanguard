#
# Release workflow — tag-triggered build + package + GitHub Release.
#
# Pushing a tag matching `v*` (e.g. v0.4.3, v0.4.4, v1.0.0-rc1) kicks
# off three parallel/sequential builds and publishes a GitHub Release
# with two ZIP assets:
#   * vanguard-vX.Y.Z-server.zip — server binaries (Linux + Windows
#     x64/x86) plus the multi-arch vanguard_vX.Y.Z.pk3
#   * vanguard-vX.Y.Z-client.zip — client pk3 only
#
# Workflow architecture (see docs/CI.md for the full rationale):
#
#   build-windows-x64 ─┐
#                      ├─→ build-linux-and-package ─→ GitHub Release
#   build-windows-x86 ─┘
#
# The Linux step needs the cross-built Windows DLLs available on disk
# at cmake-configure time, because cmake/ETLBuildMod.cmake's BUILD_MOD_PK3
# target does a FILE(GLOB) over build-windows*/vanguard/*.dll while
# generating its mod_pk3 dependency list. Running Linux after the two
# Windows jobs (and downloading the DLL artifacts into the expected
# directory layout) is what makes the multi-arch pk3 work.

name: release

on:
  push:
    tags:
      - 'v*'

# Single env-level toggle: set to "false" once the workflow is
# trusted to publish releases without manual review.
env:
  RELEASE_DRAFT: "true"

# Common cmake flags shared between the three build jobs. Mirrors the
# canonical sequence in docs/RELEASE_PROCESS.md and scripts/bootstrap.sh.
# Pulled out as a top-level env var so the three jobs stay in sync.
defaults:
  run:
    shell: bash

jobs:
  # -------------------------------------------------------------------
  # build-windows-x64 — cross-compile via mingw-w64 x86_64 toolchain.
  # Outputs four DLLs (cgame_mp_x64.dll, qagame_mp_x64.dll,
  # tvgame_mp_x64.dll, ui_mp_x64.dll) uploaded as the 'win-x64-dlls'
  # artifact for the package job to download.
  # -------------------------------------------------------------------
  build-windows-x64:
    name: Build Windows x86_64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (full history for git describe)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config mingw-w64

      - name: Configure
        run: |
          # FORCE_OMNIBOT=ON bypasses the cmake_dependent_option in
          # CMakeLists.txt:102 that silently disables FEATURE_OMNIBOT for
          # mingw cross-compiles (the dep expression is
          # `(NOT MINGW AND WIN32) OR FORCE_OMNIBOT OR ... Linux`, so
          # mingw-x64 falls through unless we force it). Without this
          # override the qagame DLL ships without the dlopen() hooks
          # for omnibot_et_x64.dll and Windows admins can't run bots.
          cmake -B build-windows \
            -DCMAKE_TOOLCHAIN_FILE=cmake/Toolchain-cross-mingw-x64-linux.cmake \
            -DCROSS_COMPILE32=OFF -DBUILD_MOD_PK3=OFF \
            -DFEATURE_OMNIBOT=ON -DFORCE_OMNIBOT=ON \
            -DCI_ETL_TAG=${{ github.ref_name }} \
            -DCI_ETL_DESCRIBE=${{ github.ref_name }} \
            -DBUILD_CLIENT=OFF -DBUILD_SERVER=OFF -DBUILD_MOD=ON \
            -DBUNDLED_LIBS=OFF -DFEATURE_LUA=OFF \
            -DFEATURE_DBMS=OFF -DFEATURE_RATING=OFF -DFEATURE_PRESTIGE=OFF \
            -DINSTALL_EXTRA=OFF

      - name: Build
        run: cmake --build build-windows -j

      - name: Verify Omni-bot symbols in qagame Win64 DLL
        run: |
          # Sanity check that prevents the v0.5.2-rc1 regression where a
          # bad build flag silently elided every #ifdef FEATURE_OMNIBOT
          # block in g_main.c. If this fails, check the FORCE_OMNIBOT
          # flag in the Configure step above.
          set -euo pipefail
          COUNT=$(strings -a build-windows/vanguard/qagame_mp_x64.dll | grep -ic "omni")
          echo "Omni-bot symbol count in qagame_mp_x64.dll: ${COUNT}"
          if [ "${COUNT}" -lt 5 ]; then
            echo "::error::FEATURE_OMNIBOT not in Win64 qagame — only ${COUNT} omni symbols (expect 30+)"
            exit 1
          fi

      - name: Upload Win64 DLLs
        uses: actions/upload-artifact@v4
        with:
          name: win-x64-dlls
          path: build-windows/vanguard/*.dll
          if-no-files-found: error
          retention-days: 7

  # -------------------------------------------------------------------
  # build-windows-x86 — same as above but with the 32-bit toolchain
  # and CROSS_COMPILE32=ON.
  # -------------------------------------------------------------------
  build-windows-x86:
    name: Build Windows x86
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (full history for git describe)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config mingw-w64

      - name: Configure
        run: |
          # FORCE_OMNIBOT=ON: same rationale as the Win64 step — without
          # it, mingw cross-compiles silently drop FEATURE_OMNIBOT.
          cmake -B build-windows-32 \
            -DCMAKE_TOOLCHAIN_FILE=cmake/Toolchain-cross-mingw-linux.cmake \
            -DCROSS_COMPILE32=ON -DBUILD_MOD_PK3=OFF \
            -DFEATURE_OMNIBOT=ON -DFORCE_OMNIBOT=ON \
            -DCI_ETL_TAG=${{ github.ref_name }} \
            -DCI_ETL_DESCRIBE=${{ github.ref_name }} \
            -DBUILD_CLIENT=OFF -DBUILD_SERVER=OFF -DBUILD_MOD=ON \
            -DBUNDLED_LIBS=OFF -DFEATURE_LUA=OFF \
            -DFEATURE_DBMS=OFF -DFEATURE_RATING=OFF -DFEATURE_PRESTIGE=OFF \
            -DINSTALL_EXTRA=OFF

      - name: Build
        run: cmake --build build-windows-32 -j

      - name: Verify Omni-bot symbols in qagame Win32 DLL
        run: |
          set -euo pipefail
          COUNT=$(strings -a build-windows-32/vanguard/qagame_mp_x86.dll | grep -ic "omni")
          echo "Omni-bot symbol count in qagame_mp_x86.dll: ${COUNT}"
          if [ "${COUNT}" -lt 5 ]; then
            echo "::error::FEATURE_OMNIBOT not in Win32 qagame — only ${COUNT} omni symbols (expect 30+)"
            exit 1
          fi

      - name: Upload Win32 DLLs
        uses: actions/upload-artifact@v4
        with:
          name: win-x86-dlls
          path: build-windows-32/vanguard/*.dll
          if-no-files-found: error
          retention-days: 7

  # -------------------------------------------------------------------
  # build-linux-and-package — final stage. Downloads the DLL artifacts
  # from the two Windows jobs into the layout cmake/ETLBuildMod.cmake
  # expects (build-windows/vanguard/, build-windows-32/vanguard/), then
  # runs the canonical Linux build with BUILD_MOD_PK3=ON which generates
  # the multi-arch vanguard_vX.Y.Z.pk3. Finally assembles two ZIPs and
  # creates the GitHub Release.
  # -------------------------------------------------------------------
  build-linux-and-package:
    name: Build Linux + Package + Release
    needs: [build-windows-x64, build-windows-x86]
    runs-on: ubuntu-22.04
    permissions:
      contents: write   # required for softprops/action-gh-release

    steps:
      - name: Checkout (full history for git describe)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config curl zip

      - name: Download Win64 DLLs
        uses: actions/download-artifact@v4
        with:
          name: win-x64-dlls
          path: build-windows/vanguard

      - name: Download Win32 DLLs
        uses: actions/download-artifact@v4
        with:
          name: win-x86-dlls
          path: build-windows-32/vanguard

      # The Omni-Bot runtime is a ~20 MB tarball ETLegacy distributes.
      # qagame, when built with FEATURE_OMNIBOT=ON, dlopen()s pieces of
      # it at map load. Cache it across runs so we don't hammer the
      # mirror on every release. Cache key tied to bootstrap.sh content
      # because that's where the URL + extraction logic lives.
      - name: Cache Omni-Bot runtime
        id: omnibot-cache
        uses: actions/cache@v4
        with:
          path: vendor/omnibot-runtime/extracted
          key: omnibot-${{ hashFiles('scripts/bootstrap.sh') }}

      - name: Fetch Omni-Bot runtime (cache miss)
        if: steps.omnibot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p vendor/omnibot-runtime/extracted
          curl --fail --location --silent --show-error \
            --output /tmp/omnibot.tar.gz \
            https://mirror.etlegacy.com/omnibot/omnibot-linux-latest.tar.gz
          tar -xzf /tmp/omnibot.tar.gz -C vendor/omnibot-runtime/extracted
          rm /tmp/omnibot.tar.gz
          test -d vendor/omnibot-runtime/extracted/omni-bot

      - name: Configure Linux + pk3
        run: |
          cmake -B build \
            -DCROSS_COMPILE32=OFF -DBUILD_MOD_PK3=ON -DFEATURE_OMNIBOT=ON \
            -DCI_ETL_TAG=${{ github.ref_name }} \
            -DCI_ETL_DESCRIBE=${{ github.ref_name }} \
            -DBUILD_CLIENT=OFF -DBUILD_SERVER=OFF -DBUILD_MOD=ON \
            -DBUNDLED_LIBS=OFF -DFEATURE_LUA=OFF \
            -DFEATURE_DBMS=OFF -DFEATURE_RATING=OFF -DFEATURE_PRESTIGE=OFF \
            -DINSTALL_EXTRA=OFF

      - name: Build Linux + generate pk3
        run: cmake --build build -j

      - name: Verify Omni-bot symbols in qagame Linux SO
        run: |
          # Sanity check that prevents the v0.5.2-rc1 regression where a
          # bad build flag silently elided every #ifdef FEATURE_OMNIBOT
          # block in g_main.c. If this fails, check the FEATURE_OMNIBOT
          # flag in the Configure Linux step above.
          set -euo pipefail
          COUNT=$(strings -a build/vanguard/qagame.mp.x86_64.so | grep -ic "omni")
          echo "Omni-bot symbol count in qagame.mp.x86_64.so: ${COUNT}"
          if [ "${COUNT}" -lt 5 ]; then
            echo "::error::FEATURE_OMNIBOT not in Linux qagame — only ${COUNT} omni symbols (expect 30+)"
            exit 1
          fi

      - name: Extract version
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Pull the matching `## v0.X.Y — DATE — TITLE` section out of
      # docs/RELEASE_NOTES.md. Falls back to a `git log` summary if the
      # release notes don't have a section for this tag.
      - name: Generate changelog
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          NOTES="docs/RELEASE_NOTES.md"

          BODY=""
          if [ -f "${NOTES}" ]; then
            BODY=$(awk -v tag="${TAG}" '
              $0 ~ "^## " tag " " { found=1; next }
              found && /^## v/    { exit }
              found               { print }
            ' "${NOTES}")
          fi

          if [ -z "${BODY// }" ]; then
            echo "::warning::No section found in ${NOTES} for ${TAG} — falling back to git log"
            PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
            if [ -n "${PREV}" ]; then
              BODY=$(git log --pretty=format:'- %s' "${PREV}..${TAG}")
              BODY=$(printf '## Changelog (auto-generated from git log)\n\n%s\n' "${BODY}")
            else
              BODY="Initial release."
            fi
          fi

          {
            printf '%s\n' "${BODY}"
            printf '\n---\n\n'
            printf '**Build:** %s run #%s\n' "${{ github.workflow }}" "${{ github.run_number }}"
            printf '**Commit:** %s\n\n' "${{ github.sha }}"
            printf '## Downloads\n\n'
            printf -- '- `vanguard-%s-server.zip` — server binaries (Linux + Win x64/x86) + multi-arch pk3\n' "${TAG}"
            printf -- '- `vanguard-%s-client.zip` — client pk3 only (~23 MB)\n\n' "${TAG}"
            printf 'Install instructions: see `INSTALL_SERVER.md` / `INSTALL_CLIENT.md` inside each archive.\n'
          } > release_body.md

          echo "--- release_body.md preview ---"
          head -30 release_body.md
          echo "--- (truncated) ---"

      - name: Assemble server ZIP
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          STAGING="staging-server"

          mkdir -p "${STAGING}/vanguard"

          # Linux .so
          cp build/vanguard/cgame.mp.x86_64.so   "${STAGING}/vanguard/"
          cp build/vanguard/qagame.mp.x86_64.so  "${STAGING}/vanguard/"
          cp build/vanguard/tvgame.mp.x86_64.so  "${STAGING}/vanguard/"
          cp build/vanguard/ui.mp.x86_64.so      "${STAGING}/vanguard/"

          # Windows .dll
          cp build/vanguard/cgame_mp_x64.dll     "${STAGING}/vanguard/"
          cp build/vanguard/qagame_mp_x64.dll    "${STAGING}/vanguard/"
          cp build/vanguard/tvgame_mp_x64.dll    "${STAGING}/vanguard/"
          cp build/vanguard/ui_mp_x64.dll        "${STAGING}/vanguard/"
          cp build/vanguard/cgame_mp_x86.dll     "${STAGING}/vanguard/"
          cp build/vanguard/qagame_mp_x86.dll    "${STAGING}/vanguard/"
          cp build/vanguard/tvgame_mp_x86.dll    "${STAGING}/vanguard/"
          cp build/vanguard/ui_mp_x86.dll        "${STAGING}/vanguard/"

          # Multi-arch pk3
          cp "build/vanguard/vanguard_${TAG}.pk3" "${STAGING}/vanguard/"

          # Brand string — must live LOOSE next to the pk3 (not inside).
          # FS_GetModList in qcommon/files.c:3413 reads description.txt
          # via FS_SV_FOpenFileRead, which never opens pk3s for it. Without
          # this copy, the engine's mod-selection menu falls back to the
          # raw fs_game name (`vanguard`) instead of `^8Vanguard^7Mod`.
          # cmake/ETLBuildMod.cmake stages it under build/vanguard/ during
          # the Linux build; we just have to forward it to the ZIP. Added
          # in v0.5.2.4 — v0.5.2.3 staged it locally but the ZIP step
          # didn't pick it up, so wahke had to copy it by hand on the
          # test PC.
          cp build/vanguard/description.txt      "${STAGING}/vanguard/"

          # Omni-bot runtime — every supported server platform. The
          # qagame .so/.dll dlopen() these at runtime; without them
          # `bot help` and `bot addbot` are no-ops. Path-relative to
          # fs_game/ via the omnibot_path cvar (default "omni-bot").
          # Linux x86_64 is what the Pterodactyl egg expects; the
          # Windows DLLs let LAN/practice hosts on Windows run bots
          # without a separate download. See INSTALL.md for placement.
          mkdir -p "${STAGING}/vanguard/omni-bot"
          cp -r vendor/omnibot-runtime/extracted/omni-bot/. \
                "${STAGING}/vanguard/omni-bot/"

          # Legal + install metadata
          cp LICENSE COPYRIGHT NOTICE            "${STAGING}/"
          cp docs/INSTALL_SERVER.md              "${STAGING}/INSTALL.md"

          (cd "${STAGING}" && zip -r "../vanguard-${TAG}-server.zip" .)
          ls -lh "vanguard-${TAG}-server.zip"

      - name: Assemble client ZIP
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          STAGING="staging-client"

          mkdir -p "${STAGING}/vanguard"
          cp "build/vanguard/vanguard_${TAG}.pk3" "${STAGING}/vanguard/"
          # See server-ZIP step for the description.txt rationale —
          # loose-file constraint of FS_GetModList. Same reason here:
          # the brand string only surfaces in the engine UI when this
          # file sits next to the pk3 in fs_game/. Added v0.5.2.4.
          cp build/vanguard/description.txt      "${STAGING}/vanguard/"
          cp LICENSE                              "${STAGING}/"
          cp docs/INSTALL_CLIENT.md               "${STAGING}/INSTALL.md"

          (cd "${STAGING}" && zip -r "../vanguard-${TAG}-client.zip" .)
          ls -lh "vanguard-${TAG}-client.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Toggle via top-level env. Switch to false once the workflow
          # is trusted (one-line edit, no logic change).
          draft: ${{ env.RELEASE_DRAFT == 'true' }}
          tag_name: ${{ github.ref_name }}
          name: VanguardMod ${{ github.ref_name }}
          body_path: release_body.md
          files: |
            vanguard-${{ steps.version.outputs.tag }}-server.zip
            vanguard-${{ steps.version.outputs.tag }}-client.zip
          fail_on_unmatched_files: true
