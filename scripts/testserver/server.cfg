// VanguardMod local test server config
// Loaded by scripts/testserver/run.sh — not a production template.

set sv_hostname        "VanguardMod Local Test"
set sv_maxclients      "8"
set g_gametype         "2"     // Objective
set sv_pure            "0"     // local testing only
set net_ip             "0.0.0.0"  //
set sv_lanForceRate    "0"
set sv_floodprotect    "0"

// --- Omni-Bot --------------------------------------------------------------
// bot_enable is CVAR_LATCH and must be set before map load, so it stays in
// the early block here (the +exec server.cfg in run.sh runs before +map).
// omnibot_path is relative to fs_game/, so "omni-bot" resolves to
// build/vanguard/omni-bot/, populated by scripts/bootstrap.sh from the
// mirror.etlegacy.com runtime tarball. See docs/TESTING.md for setup.
set bot_enable         "1"
set omnibot_enable     "1"
set omnibot_path       "omni-bot"

set sv_allowDownload   "1"
set sv_wwwDownload     "0"
set sv_maxRate         "999999999999"				// 10000 standard but poor for ET
set sv_dl_maxRate      "42000"			// increase/decerease if you have plenty/little spare bandwidth

// Bring the map up immediately on first run
set g_warmup           "5"

set vanguard_dev       "1"
set sv_cheats          "1"
