// vanguard_dev.cfg — flips the VanguardMod dev-mode toggles to "on".
//
// Usage:  /exec configs/vanguard_dev.cfg   (server-side rcon or console)
//
// Activates the master switch on the server, which forces the
// underlying upstream debug cvars (g_debugPlayerHitboxes, g_debugBullets)
// into visualisation mode and broadcasts hitbox / bullet railtrails to
// every connected client. The server log gets a loud DEV MODE banner
// at toggle and again every five minutes for as long as the mode is
// active.
//
// DO NOT run this on a public / cup / live server. Hitbox visuals are
// strictly a development and dispute-analysis tool. The server-side
// banner will additionally scream if any sv_master* slot is populated.
//
// To go back to a clean state:  set vanguard_dev 0   (or exec
// configs/vanguard_competitive.cfg).

set vanguard_dev          "1"

// Local render filters (clients can still down-tune these on their own
// machines without the server's permission, since vanguard_dev=1 has
// already authorised them to see the data).
set cg_vanguardDevHitboxes "1"   // 0 off, 1 boxes, 2 boxes + bullet lines
set cg_vanguardDevAlpha    "0.4"

echo "VanguardMod: dev mode config applied (vanguard_dev=1)."
