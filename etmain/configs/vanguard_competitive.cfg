// vanguard_competitive.cfg — production / cup-server preset for VanguardMod.
//
// Counterpart to vanguard_dev.cfg. Forces every dev-mode and debug
// switch off so a live match is not contaminated by hitbox overlays
// or extra cvars an admin might have left enabled by accident.
//
// Usage:  /exec configs/vanguard_competitive.cfg
//
// Apply this on every cup / scrim server before going public. The
// VanguardMod dev mode is fully disabled and reset; upstream's
// g_debugPlayerHitboxes / g_debugBullets are zeroed for good measure.

// VanguardMod master switch off
set vanguard_dev           "0"

// Belt-and-suspenders: clear the upstream debug cvars dev mode
// captures. If dev mode was off already these were never touched and
// this is a no-op; if it was on the line above already restored them.
set g_debugPlayerHitboxes  "0"
set g_debugBullets         "0"
set g_debugDamage          "0"
set g_debugHitboxes        "0"

// Client render filter — also clear it locally for any operator who
// runs a listen-server style scrim.
set cg_vanguardDevHitboxes "0"

// Pure server, no asset substitution
set sv_pure                "1"

// Phase 7.2 cup netcode profile: bumps sv_fps to 40 and re-asserts
// g_antilag / g_antiwarp on map load. Latched cvar — applies on
// next map restart, not immediately. See docs/CUP_VS_PUBLIC.md for
// the tradeoff table and the Pterodactyl-gotcha escape hatch.
set vanguard_netcode_profile "cup"

echo "VanguardMod: competitive config applied (dev mode off, sv_pure 1, cup netcode)."
